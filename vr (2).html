<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trải Nghiệm VR Tour - Lân Sư Rồng</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --c-red: #D9381E;
            --c-teal: #006B76;
            --c-paper: #F9F7F2;
            --c-ink: #1a1a1a;
            --f-title: 'Playfair Display', serif;
            --f-body: 'Lora', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--f-body);
            background-color: var(--c-paper);
            color: var(--c-ink);
            overflow: hidden; /* Ngăn cuộn trang chính để tập trung vào VR */
        }

        /* Texture giấy điệp đồng bộ */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 9999;
        }

        /* Navbar đồng bộ index.html */
        .navbar {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background-color: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            border-top: 5px solid var(--c-red);
            padding: 10px 0;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .nav-inner { display: flex; justify-content: space-between; align-items: center; height: 60px; }
        .logo { font-family: var(--f-title); font-size: 1.6rem; font-weight: 800; color: var(--c-red); text-decoration: none; text-transform: uppercase; }
        .back-link { font-weight: 600; text-decoration: none; color: var(--c-teal); font-size: 0.9rem; }
        .back-link:hover { color: var(--c-red); }

        /* VR Container */
        .vr-container {
            width: 100%;
            height: 100vh;
            padding-top: 80px; /* Chừa chỗ cho navbar */
            background-color: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .vr-info-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-left: 4px solid var(--c-red);
            font-size: 0.9rem;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="logo">LÂN SƯ RỒNG</a>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> QUAY LẠI TRANG CHỦ</a>
        </div>
    </nav>

    <main class="vr-container" style="width: 100%;">
        <iframe src="/out/index.html" style="width: 100%;" allow="gyroscope; accelerometer; vr;" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>
    </main>

    <div class="vr-info-overlay">
        <strong>Không gian thực tế ảo</strong><br>
        Sử dụng chuột hoặc cảm ứng để xoay 360 độ
    </div>

</body>
</html>
