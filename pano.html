<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" /> 
		<title>Lân Sư Rồng VR Tour</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta name="mobile-web-app-capable" content="yes" />
		<style type="text/css" title="Default">
			/* Cấu hình hiển thị toàn màn hình cho trình phát VR */
			html {
				height:100%;
			}
			body {
				height:100%;
				margin: 0px;
				overflow:hidden;
				-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
			}
			::-webkit-scrollbar {
				background-color: rgba(0,0,0,0.5);
				width: 0.75em;
			}
			::-webkit-scrollbar-thumb {
    			background-color:  rgba(255,255,255,0.5);
			}
		</style>	
	</head>
	<body>
		<script type="text/javascript" src="pano2vr_player.js"></script>
		<script type="text/javascript" src="skin.js"></script>
		
		<script src="webxr/three.min.js"></script>
		<script src="webxr/webxr-polyfill.min.js"></script>

		<div id="container" style="width:100%;height:100%;overflow:hidden;">
			<br>Đang tải nội dung VR...<br><br>
		</div>

		<script type="text/javascript">
			// Khởi tạo trình phát Pano2VR
			var pano = new pano2vrPlayer("container");
			
			// Cấu hình Skin (giao diện điều khiển)
			var skin = new pano2vrSkin(pano);
			
			// Tải dữ liệu từ file pano.xml
			window.addEventListener("load", function() {
				pano.readConfigUrl("pano.xml");
			});
		</script>
		<noscript>
			<p>Vui lòng bật Javascript để xem nội dung này.</p>
		</noscript>
	</body>
</html>
